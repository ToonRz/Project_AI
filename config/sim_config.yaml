project:
  name: two_agent_hotel_dynamic_pricing
  python_minimum: "3.11"
  random_seed: 777

paths:
  hotel_bookings: data/hotel_bookings.csv
  expedia: data/expedia_train.csv
  tier_profiles: config/tier_profiles.json
  eda_results: results/eda
  results: results
  models: models

data:
  hotel_bookings_source: https://www.kaggle.com/datasets/jessemostipak/hotel-booking-demand
  expedia_source: https://www.kaggle.com/competitions/expedia-personalized-sort/data
  conversion_rate: 0.35
  conversion_rate_sensitivity: [0.25, 0.35, 0.45]
  adr_trim_quantile: 0.995
  minimum_adr: 0.0
  business_market_segments: [Corporate, Aviation]
  ota_distribution_channels: [TA/TO]
  lead_time_cap_days: 30
  stay_night_expansion: true
  arrival_date_columns: {year: arrival_date_year, month: arrival_date_month, day: arrival_date_day_of_month}
  stay_length_columns: {weekday_nights: stays_in_week_nights, weekend_nights: stays_in_weekend_nights}
  lead_time_bins:
    edges: [-0.5, 1, 3, 7, 14, 30, 60, 90, .inf]
    labels: [0-1, 2-3, 4-7, 8-14, 15-30, 31-60, 61-90, 91+]
  expedia_partial_pooling_k: 50.0
  hbd_room_type_mapping_count: 3
  hbd_room_type_mapping_selection: most_frequent_overall
  hbd_room_type_size_order: segment_median_adr_ascending
  hbd_beta_pair_aggregation: median
  expedia_columns:
    property_id: prop_id
    star_rating: prop_starrating
    price: price_usd
    booking_label: booking_bool
  hbd_room_type_column: reserved_room_type
  expedia_tier_star_bins:
    budget: [1, 2, 3]
    midscale: [4]
    luxury: [5]

episode:
  booking_horizon_days: 30
  hours_per_day: 24
  steps: 720
  season_names: [low, shoulder, high]
  season_months:
    low: [1, 2, 6, 9, 10, 11]
    shoulder: [3, 4, 5, 7]
    high: [8, 12]
  weekend_probability: 0.2857142857142857
  season_probabilities: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  weekend_weekdays: [Friday, Saturday]

tiers:
  budget:
    id: 0
    stars: 3
    reference_price_thb: 1200
    business_share: 0.15
    demand_per_room_episode: 2.3
    variable_cost_thb: 250
    ota_share_leisure: 0.70
    ota_share_business: 0.35
    segments:
      leisure:
        wtp_median_reference: 0.88
        wtp_sigma: 0.20
        size_beta: 0.45
        cancel_base: 0.38
        hour_profile:
          floor: 0.12
          gaussian_1: {weight: 1.0, mean: 20.5, sigma: 2.2}
          gaussian_2: {weight: 0.35, mean: 13.0, sigma: 3.0}
          gaussian_2_enabled: true
          normalizer: sum
          center: 17.0
          center_sigma: 7.0
      business:
        wtp_median_reference: 1.35
        wtp_sigma: 0.20
        size_beta: 0.80
        cancel_base: 0.15
        hour_profile:
          floor: 0.04
          gaussian_1: {weight: 1.0, mean: 13.0, sigma: 3.0}
          gaussian_2: {weight: 0.12, mean: 21.0, sigma: 1.5}
          gaussian_2_enabled: true
          normalizer: sum
          arrival_decay_days: 4.5
    rooms:
      - {name: Standard, size_m2: 18, count: 36}
      - {name: Superior, size_m2: 24, count: 18}
      - {name: Family, size_m2: 32, count: 6}
  midscale:
    id: 1
    stars: 4
    reference_price_thb: 2500
    business_share: 0.30
    demand_per_room_episode: 2.7
    variable_cost_thb: 450
    ota_share_leisure: 0.70
    ota_share_business: 0.35
    segments:
      leisure:
        wtp_median_reference: 0.85
        wtp_sigma: 0.24
        size_beta: 0.50
        cancel_base: 0.30
        hour_profile:
          floor: 0.12
          gaussian_1: {weight: 1.0, mean: 20.5, sigma: 2.2}
          gaussian_2: {weight: 0.35, mean: 13.0, sigma: 3.0}
          gaussian_2_enabled: true
          normalizer: sum
          center: 17.0
          center_sigma: 7.0
      business:
        wtp_median_reference: 1.55
        wtp_sigma: 0.22
        size_beta: 0.90
        cancel_base: 0.10
        hour_profile:
          floor: 0.04
          gaussian_1: {weight: 1.0, mean: 13.0, sigma: 3.0}
          gaussian_2: {weight: 0.12, mean: 21.0, sigma: 1.5}
          gaussian_2_enabled: true
          normalizer: sum
          arrival_decay_days: 4.5
    rooms:
      - {name: Standard, size_m2: 26, count: 22}
      - {name: Deluxe, size_m2: 34, count: 12}
      - {name: Suite, size_m2: 52, count: 6}
  luxury:
    id: 2
    stars: 5
    reference_price_thb: 6000
    business_share: 0.35
    demand_per_room_episode: 2.5
    variable_cost_thb: 900
    ota_share_leisure: 0.70
    ota_share_business: 0.35
    segments:
      leisure:
        wtp_median_reference: 0.92
        wtp_sigma: 0.34
        size_beta: 0.55
        cancel_base: 0.20
        hour_profile:
          floor: 0.12
          gaussian_1: {weight: 1.0, mean: 20.5, sigma: 2.2}
          gaussian_2: {weight: 0.35, mean: 13.0, sigma: 3.0}
          gaussian_2_enabled: true
          normalizer: sum
          center: 17.0
          center_sigma: 7.0
      business:
        wtp_median_reference: 1.65
        wtp_sigma: 0.26
        size_beta: 1.00
        cancel_base: 0.06
        hour_profile:
          floor: 0.04
          gaussian_1: {weight: 1.0, mean: 13.0, sigma: 3.0}
          gaussian_2: {weight: 0.12, mean: 21.0, sigma: 1.5}
          gaussian_2_enabled: true
          normalizer: sum
          arrival_decay_days: 4.5
    rooms:
      - {name: Deluxe, size_m2: 40, count: 13}
      - {name: Premier, size_m2: 55, count: 8}
      - {name: Suite, size_m2: 85, count: 4}

pricing:
  reference_size_elasticity: 0.8
  reference_rounding_thb: 50
  price_rounding_thb: 25
  markup_levels: [0.70, 0.85, 1.00, 1.15, 1.30, 1.50, 1.75]
  max_level_change_per_hour: 1
  minimum_large_room_price_ratio: 1.05
  ota_commission: 0.18
  customer_value_size_reference: minimum_room_size
  initial_price_level: 2

demand:
  leisure_arrival_peak_day: 17.0
  leisure_arrival_sigma_days: 7.0
  business_arrival_decay_days: 4.5
  season_multipliers:
    leisure: {low: 0.70, shoulder: 1.00, high: 1.35}
    business: {low: 0.90, shoulder: 1.00, high: 1.10}
  dow_multipliers:
    weekday: {leisure: 0.85, business: 1.15}
    weekend: {leisure: 1.40, business: 0.55}
  hourly_profiles:
    leisure:
      floor: 0.12
      gaussian_1: {weight: 1.0, mean: 20.5, sigma: 2.2}
      gaussian_2: {weight: 0.35, mean: 13.0, sigma: 3.0}
    business:
      floor: 0.04
      gaussian_1: {weight: 1.0, mean: 13.0, sigma: 3.0}
      gaussian_2: {weight: 0.12, mean: 21.0, sigma: 1.5}
  hotel_amplitude:
    season: 1.0
    weekend: 1.0
  booking_cancel_time_uniform: true
  cancellation_lead_factor_start: 0.4
  cancellation_lead_factor_slope: 0.6

synthetic_hotels:
  seed: 777
  train_per_tier: 30
  test_per_tier: 10
  validation_seed: 778
  validation_per_tier: 10
  h_shift_standard_deviation_hours: 1.2
  amplitude:
    season_base: 1.0
    season_z_scale: 0.25
    season_min: 0.5
    season_max: 1.5
    weekend_base: 1.0
    weekend_z_scale: 0.3
    weekend_min: 0.4
    weekend_max: 1.6
  additive_spreads:
    business_share: 0.08
    business_share_min: 0.05
    business_share_max: 0.6
    ota_share: 0.10
    ota_share_min: 0.0
    ota_share_max: 1.0
  multiplicative_spreads:
    reference_price: 0.15
    demand: 0.20
    wtp: 0.10
    business_wtp_extra: 0.05
    sigma: 0.20
    beta: 0.15
    cancel: 0.25
    cost: 0.15
    room_size: 0.12
    room_count: 0.30
  minimum_room_count: 2
  single_profile_mode: single
  domain_randomization_mode: domain_randomization

rl:
  n_step: 24
  gamma: 1.0
  alpha_n_step_min: 0.003
  alpha_n_step_count_exponent: 0.7
  occupancy_penalty_per_room: 0.0
  occupancy_floor_margin: 0.03
  alpha_monte_carlo_min: 0.005
  epsilon_min: 0.03
  epsilon_decay_episode_fraction: 0.7
  training_episodes_per_tier: 4000
  learning_curve_moving_average_window: 100
  progress_interval_episodes: 1000
  checkpoint_interval_episodes: 1000
  monte_carlo_enabled: true
  q_default_value: 0.0
  unseen_state_markup_level: 2
  state:
    day_bucket_ranges: [[1, 1], [2, 2], [3, 3], [4, 5], [6, 7], [8, 10], [11, 14], [15, 19], [20, 24], [25, 30]]
    remaining_bucket_count: 8
    time_period_hours: 6
    clock_periods_per_day: 4

evaluation:
  episodes_per_tier: 500
  seed_base: 9000
  validation_seed_base: 19000
  seed_episode_multiplier: 7
  common_random_numbers: true
  test_hotel_pool: test
  model_variants:
    final: models/q_table_final.npy
    n_step_domain_randomization: models/q_table_n_step_domain_randomization.npy
    n_step_single: models/q_table_n_step_single.npy
    monte_carlo_domain_randomization: models/q_table_monte_carlo_domain_randomization.npy
    monte_carlo_single: models/q_table_monte_carlo_single.npy
  stress_hotels_per_tier: 10
  stress_seed_base: 4242
  stress_worlds:
    calibrated: {wtp: 1.0, demand: 1.0, sigma: 1.0}
    wtp_low: {wtp: 0.85, demand: 1.0, sigma: 1.0}
    wtp_high: {wtp: 1.15, demand: 1.0, sigma: 1.0}
    demand_low: {wtp: 1.0, demand: 0.75, sigma: 1.0}
    sigma_low: {wtp: 1.0, demand: 1.0, sigma: 0.70}
  spread_sensitivity_factors: [0.5, 1.0, 1.5]
  leave_one_hotel_out: true
  policy_replay_episode: 0
  policy_replay_hotel_index: 0
  heatmap_remaining_bucket: 4

baselines:
  fixed_markup_level: 2
  rule_thresholds: [0.4, 0.7, 0.9]
  rule_markup_levels: [1, 2, 4, 5]

eda:
  output_figures: 5
  figure_size_inches: [8, 4.5]
  figure_dpi: 150
  histogram_bins: 40
  month_order: [January, February, March, April, May, June, July, August, September, October, November, December]
  weekday_order: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
  figures:
    - lead_time_by_segment
    - adr_by_month
    - adr_by_weekday
    - cancellation_by_lead_time
    - ota_share_by_segment

tiering:
  logistic_max_iterations: 200

plots:
  figure_size_inches: [12, 5]
  main_figure_size_inches: [14, 5]
  heatmap_figure_size_inches: [10, 8]
  figure_dpi: 150

calibration:
  arrival_lead_days_min: 0
  arrival_lead_days_max: 30
  wtp_log_std_ddof: 1
  cancellation_fit_lead_days_max: 30
  cancellation_logistic_max_iterations: 300
  cancellation_probability_clip: [0.0, 1.0]
  cancellation_deposit_feature: deposit_type
  results_directory: results/calibration
